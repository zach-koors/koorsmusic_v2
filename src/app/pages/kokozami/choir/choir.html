<div class="choir-page">
  <div class="state-box">
  <h1 class="state-text" [ngClass]="localFinished ? 'FINISHED' : (performance?.status || 'IDLE')">
    <ng-container *ngIf="localFinished">THANK YOU</ng-container>
    <ng-container *ngIf="!localFinished && performance?.status === 'PLAYING'">
      PLAYING
      <span class="part-name">{{ assignedPartName }}</span>
    </ng-container>
    <ng-container *ngIf="!localFinished && performance?.status !== 'PLAYING'">{{ performance?.status || 'IDLE' }}</ng-container>
  </h1>
    <div *ngIf="performance?.status === 'READY'" class="counter">Participants: {{ performance?.participantCount }}</div>

    <div *ngIf="!audioEnabled && performance?.status === 'READY'" class="audio-enable-modal">
      <div class="modal-content">
        <h2>Audio Required</h2>
        <p>Tap below to enable audio for the performance</p>
        <button (click)="enableAudio()">Enable Audio</button>
      </div>
    </div>

    <div *ngIf="isLeader && performance?.status === 'READY'" class="controls">
      <button (click)="onStart()" [disabled]="buttonsDisabled">START</button>
      <button (click)="onReset()" [disabled]="buttonsDisabled">RESET</button>
    </div>

    <canvas #vizCanvas class="viz" *ngIf="performance?.status === 'PLAYING'"></canvas>
    <!-- Part indicator moved into headerText -->

  
  </div>
</div>
