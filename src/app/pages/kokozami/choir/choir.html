<div class="choir-page">
  <div class="state-box">
  <h1 class="state-text" [ngClass]="localFinished ? 'FINISHED' : (performance?.status || 'IDLE')">{{ localFinished ? 'THANK YOU' : (performance?.status || 'IDLE') }}</h1>
    <div *ngIf="performance?.status === 'READY'" class="counter">Participants: {{ performance?.participantCount }}</div>

    <div *ngIf="!audioEnabled && performance?.status === 'READY'" class="audio-enable">
      <button (click)="enableAudio()">Tap to enable audio</button>
    </div>

    <div *ngIf="isLeader && performance?.status === 'READY'" class="controls">
      <button (click)="onStart()" [disabled]="buttonsDisabled">START</button>
      <button (click)="onReset()" [disabled]="buttonsDisabled">RESET</button>
    </div>

    <canvas #vizCanvas class="viz" *ngIf="performance?.status === 'PLAYING'"></canvas>

  
  </div>
</div>
